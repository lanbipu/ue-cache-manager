[package]
name = "uecm"
version = "0.1.0"
description = "UE Cache Manager"
authors = ["lanbipu"]
edition = "2021"
rust-version = "1.75"
default-run = "uecm"

[lib]
name = "uecm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uecm"
path = "src/main.rs"

[[bin]]
name = "uecm-cli"
path = "src/bin/uecm-cli.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ipnet = "2.9"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
sha2 = "0.10"
clap = { version = "~4.5", features = ["derive", "env"] }
directories = "5.0"
atty = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
